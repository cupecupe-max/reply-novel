<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 릴레이 소설 방 📚</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--primary); }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-back { background: #e2e8f0; color: #334155; }
    .btn-back:hover { background: #cbd5e1; }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

    main { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 2rem 1.5rem; }

    .info-box {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      color: #3730a3;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* 1. 방 목록 그리드 */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1rem;
    }

    .room-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .room-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .room-number { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .room-label { font-size: 0.9rem; font-weight: 600; }
    .room-count { font-size: 0.75rem; color: var(--text-muted); background: #f1f5f9; padding: 2px 8px; border-radius: 10px; }

    /* 2. 소설 뷰 */
    #novel-detail-view { display: none; }

    .novel-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      min-height: 250px;
      max-height: 50vh;
      overflow-y: auto;
    }

    .novel-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
    }

    .novel-entries { display: flex; flex-direction: column; gap: 0.75rem; }

    .novel-entry {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      line-height: 1.5;
    }

    .entry-author {
      font-weight: 700;
      color: var(--primary);
      background: #e0e7ff;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .entry-text { flex: 1; font-size: 1rem; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 3rem 0; font-size: 0.95rem; }

    .input-form-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .form-row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }

    .input-author {
      width: 140px;
      padding: 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-content {
      flex: 1;
      padding: 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-author:focus, .input-content:focus { border-color: var(--primary); }

    .sync-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .input-author { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">📖 우리 반 릴레이 소설 방</h1>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span id="sync-indicator" class="sync-status">🔄 데이터 불러오는 중...</span>
      <button id="btn-back" class="btn btn-back" style="display: none;" onclick="goHome()">← 방 목록</button>
    </div>
  </header>

  <main>
    <!-- 1. 방 목록 -->
    <section id="room-list-view">
      <div class="info-box">
        💡 <strong>이용 방법:</strong> 원하는 방을 선택해서 들어가세요. 5초마다 자동으로 친구들이 쓴 새 문장이 업데이트됩니다!
      </div>
      <div class="room-grid" id="room-grid"></div>
    </section>

    <!-- 2. 소설 상세 뷰 -->
    <section id="novel-detail-view">
      <div class="novel-container" id="novel-scroll-box">
        <div class="novel-meta">
          <h2 id="current-room-title">1번 방 이야기</h2>
          <span id="line-count" class="room-count">0개 문장</span>
        </div>
        <div class="novel-entries" id="novel-entries"></div>
      </div>

      <div class="input-form-box">
        <div class="form-row">
          <input type="text" id="input-name" class="input-author" placeholder="내 이름/번호" maxlength="10" />
          <input type="text" id="input-line" class="input-content" placeholder="이어질 내용을 한 줄 써보세요... (Enter 키)" maxlength="200" />
        </div>
        <div style="display: flex; justify-content: flex-end;">
          <button id="btn-submit" class="btn btn-primary" onclick="submitLine()">한 줄 이어쓰기 ✍️</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ★★★ [선생님 설정] 1단계에서 복사한 웹 앱 URL을 따옴표 안에 넣어주세요 ★★★
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqSJBrRANhXekd0WOaHygokpJhJtwC4ZhRT71hZfruzNM0gXNaueA2KGjX1S9r87eoOg/exec";

    const TOTAL_ROOMS = 26;
    let currentRoom = null;
    let novelData = {};
    let pollingTimer = null;

    // 서버에서 전체 데이터 불러오기
    async function fetchData() {
      if (!SCRIPT_URL || SCRIPT_URL.includes("여기에_복사한")) {
        document.getElementById("sync-indicator").innerText = "⚠️ 구글 시트 URL을 설정해 주세요";
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL);
        novelData = await res.json();
        document.getElementById("sync-indicator").innerText = "🟢 실시간 연결됨";

        if (currentRoom) {
          renderNovelEntries();
        } else {
          renderRoomList();
        }
      } catch (err) {
        console.error(err);
        document.getElementById("sync-indicator").innerText = "🔴 연결 재시도 중...";
      }
    }

    function renderRoomList() {
      const container = document.getElementById("room-grid");
      container.innerHTML = "";

      for (let i = 1; i <= TOTAL_ROOMS; i++) {
        const count = novelData[i] ? novelData[i].length : 0;
        const card = document.createElement("div");
        card.className = "room-card";
        card.onclick = () => openRoom(i);
        card.innerHTML = `
          <div class="room-number">${i}</div>
          <div class="room-label">${i}번 방</div>
          <div class="room-count">${count}문장 이어짐</div>
        `;
        container.appendChild(card);
      }
    }

    function openRoom(roomNum) {
      currentRoom = roomNum;
      document.getElementById("room-list-view").style.display = "none";
      document.getElementById("novel-detail-view").style.display = "block";
      document.getElementById("btn-back").style.display = "inline-block";
      document.getElementById("page-title").innerText = `📖 ${roomNum}번 방 릴레이 소설`;
      document.getElementById("current-room-title").innerText = `${roomNum}번 방 릴레이 소설`;

      document.getElementById("input-line").value = "";
      renderNovelEntries();
      document.getElementById("input-name").focus();
    }

    function goHome() {
      currentRoom = null;
      document.getElementById("novel-detail-view").style.display = "none";
      document.getElementById("room-list-view").style.display = "block";
      document.getElementById("btn-back").style.display = "none";
      document.getElementById("page-title").innerText = "📖 우리 반 릴레이 소설 방";
      renderRoomList();
    }

    function renderNovelEntries() {
      const container = document.getElementById("novel-entries");
      const lineCountBadge = document.getElementById("line-count");
      container.innerHTML = "";

      const entries = novelData[currentRoom] || [];
      lineCountBadge.innerText = `${entries.length}개 문장`;

      if (entries.length === 0) {
        container.innerHTML = `<div class="empty-state">아직 쓰여진 이야기가 없어요!<br>첫 문장을 적어 시작해 보세요 ✨</div>`;
        return;
      }

      entries.forEach((item) => {
        const row = document.createElement("div");
        row.className = "novel-entry";
        row.innerHTML = `
          <span class="entry-author">${escapeHtml(item.name)}</span>
          <span class="entry-text">${escapeHtml(item.text)}</span>
        `;
        container.appendChild(row);
      });

      const scrollBox = document.getElementById("novel-scroll-box");
      scrollBox.scrollTop = scrollBox.scrollHeight;
    }

    async function submitLine() {
      const nameInput = document.getElementById("input-name");
      const lineInput = document.getElementById("input-line");
      const submitBtn = document.getElementById("btn-submit");

      const name = nameInput.value.trim();
      const text = lineInput.value.trim();

      if (!name) { alert("이름(또는 번호)을 입력하세요!"); nameInput.focus(); return; }
      if (!text) { alert("소설 내용을 입력하세요!"); lineInput.focus(); return; }

      submitBtn.disabled = true;
      submitBtn.innerText = "등록 중...";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // Google Apps Script 전송을 위한 모드
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            room: currentRoom,
            name: name,
            text: text
          })
        });

        // 로컬에 임시 추가 후 다시 동기화
        if (!novelData[currentRoom]) novelData[currentRoom] = [];
        novelData[currentRoom].push({ name, text });
        renderNovelEntries();

        lineInput.value = "";
        setTimeout(fetchData, 1000); // 1초 뒤 최신 데이터 다시 받아오기
      } catch (err) {
        alert("등록 중 문제가 발생했습니다. 다시 시도해 주세요.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "한 줄 이어쓰기 ✍️";
      }
    }

    document.getElementById("input-line").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitLine();
    });

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 5초마다 자동 동기화 (폴링)
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
