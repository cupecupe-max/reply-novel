<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 릴레이 소설 방 📚</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .btn-back { background: #e2e8f0; color: #334155; }
    .btn-back:hover { background: #cbd5e1; }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-admin { background: #334155; color: #ffffff; }
    .btn-admin:hover { background: #1e293b; }
    .btn-admin.active { background: #059669; }

    .btn-del-sm {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-del-sm:hover { background: #fca5a5; }

    main { flex: 1; max-width: 950px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }

    .info-box {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      color: #3730a3;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .admin-banner {
      display: none;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      justify-content: space-between;
      align-items: center;
    }

    /* 1. 방 그리드 */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 1rem;
    }

    .room-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .room-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .room-number { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .room-label { font-size: 0.9rem; font-weight: 600; }
    .room-count { font-size: 0.75rem; color: var(--text-muted); background: #f1f5f9; padding: 2px 8px; border-radius: 10px; }

    /* 2. 소설 상세 뷰 */
    #novel-detail-view { display: none; }

    .novel-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      min-height: 260px;
      max-height: 52vh;
      overflow-y: auto;
    }

    .novel-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .novel-entries { display: flex; flex-direction: column; gap: 0.75rem; }

    .novel-entry {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      line-height: 1.5;
    }

    .entry-author {
      font-weight: 700;
      color: var(--primary);
      background: #e0e7ff;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .entry-text { flex: 1; font-size: 1rem; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 3rem 0; font-size: 0.95rem; }

    .input-form-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .form-row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }

    .input-author {
      width: 140px;
      padding: 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-content {
      flex: 1;
      padding: 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-author:focus, .input-content:focus { border-color: var(--primary); }
    .sync-status { font-size: 0.8rem; color: var(--text-muted); }

    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: inline-flex !important; }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .input-author { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">📖 우리 반 릴레이 소설 방</h1>
    <div class="header-actions">
      <span id="sync-indicator" class="sync-status">🔄 연결 확인 중...</span>
      <button id="btn-delete-all" class="btn btn-danger admin-only" onclick="confirmDeleteAll()">🗑️ 전체 초기화</button>
      <button id="btn-admin-toggle" class="btn btn-admin" onclick="toggleAdminMode()">🔒 관리자 모드</button>
      <button id="btn-back" class="btn btn-back" style="display: none;" onclick="goHome()">← 방 목록</button>
    </div>
  </header>

  <main>
    <div id="admin-banner" class="admin-banner">
      <span>⚙️ <strong>관리자 모드 실행 중:</strong> 글 삭제 권한이 켜져 있습니다.</span>
      <button class="btn-del-sm" onclick="toggleAdminMode()">관리자 끄기</button>
    </div>

    <!-- 1. 방 목록 -->
    <section id="room-list-view">
      <div class="info-box">
        💡 <strong>이용 방법:</strong> 내 번호 방을 선택해서 들어가세요. 친구들과 번갈아 가며 멋진 릴레이 소설을 완성해 보세요!
      </div>
      <div class="room-grid" id="room-grid"></div>
    </section>

    <!-- 2. 소설 방 상세 -->
    <section id="novel-detail-view">
      <div class="novel-container" id="novel-scroll-box">
        <div class="novel-meta">
          <div>
            <h2 id="current-room-title" style="display:inline; margin-right: 0.5rem;">1번 방 이야기</h2>
            <span id="line-count" class="room-count">0개 문장</span>
          </div>
          <button id="btn-delete-room" class="btn btn-danger admin-only" onclick="confirmDeleteRoom()">🗑️ 이 방 전체 삭제</button>
        </div>
        <div class="novel-entries" id="novel-entries"></div>
      </div>

      <div class="input-form-box">
        <div class="form-row">
          <input type="text" id="input-name" class="input-author" placeholder="내 이름/번호" maxlength="10" />
          <input type="text" id="input-line" class="input-content" placeholder="이어질 내용을 한 줄 써보세요... (Enter 키)" maxlength="200" />
        </div>
        <div style="display: flex; justify-content: flex-end;">
          <button id="btn-submit" class="btn btn-primary" onclick="submitLine()">한 줄 이어쓰기 ✍️</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ★★★ [선생님 확인] 구글 스프레드시트 배포 URL을 넣어주세요 ★★★
    const SCRIPT_URL = "[https://script.google.com/macros/s/AKfycbwWVT9I-HZBaIkmG7CrDNDgdZtNvMr56NzyGfwR7miNjaB64Vba-pqVqv_Ru_fqSIY5mg/exec]";
    const ADMIN_PASSWORD = "1234";

    const TOTAL_ROOMS = 26;
    let currentRoom = null;
    let novelData = {};
    let isAdmin = false;

    // 초기 실행: 서버 연결과 무관하게 방 카드는 무조건 즉시 화면에 그림
    renderRoomList();

    function toggleAdminMode() {
      if (isAdmin) {
        isAdmin = false;
        document.body.classList.remove("is-admin");
        document.getElementById("btn-admin-toggle").innerText = "🔒 관리자 모드";
        document.getElementById("btn-admin-toggle").classList.remove("active");
        document.getElementById("admin-banner").style.display = "none";
        alert("관리자 모드가 해제되었습니다.");
      } else {
        const pw = prompt("관리자 비밀번호를 입력하세요:");
        if (pw === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add("is-admin");
          document.getElementById("btn-admin-toggle").innerText = "🔓 관리자 On";
          document.getElementById("btn-admin-toggle").classList.add("active");
          document.getElementById("admin-banner").style.display = "flex";
          alert("관리자 권한이 켜졌습니다.");
        } else if (pw !== null) {
          alert("비밀번호가 일치하지 않습니다!");
        }
      }
      if (currentRoom) renderNovelEntries();
    }

    // JSONP 방식으로 안전하게 구글 데이터 읽어오기
    function fetchData() {
      if (!SCRIPT_URL || SCRIPT_URL.includes("여기에_복사한")) {
        document.getElementById("sync-indicator").innerText = "⚠️ 구글 웹앱 URL 미설정";
        return;
      }

      const old = document.getElementById("script-jsonp");
      if (old) old.remove();

      const script = document.createElement("script");
      script.id = "script-jsonp";
      const sep = SCRIPT_URL.includes("?") ? "&" : "?";
      script.src = SCRIPT_URL + sep + "callback=loadDataCallback&_nocache=" + Date.now();
      script.onerror = function() {
        document.getElementById("sync-indicator").innerText = "🔴 구글 연결 확인 필요";
      };
      document.body.appendChild(script);
    }

    // 구글 스크립트 응답 콜백
    window.loadDataCallback = function(data) {
      novelData = data || {};
      document.getElementById("sync-indicator").innerText = "🟢 실시간 연결됨";
      if (currentRoom) {
        renderNovelEntries();
      } else {
        renderRoomList();
      }
    };

    function renderRoomList() {
      const container = document.getElementById("room-grid");
      if (!container) return;
      container.innerHTML = "";

      for (let i = 1; i <= TOTAL_ROOMS; i++) {
        const count = (novelData && novelData[i]) ? novelData[i].length : 0;
        const card = document.createElement("div");
        card.className = "room-card";
        card.onclick = () => openRoom(i);
        card.innerHTML = `
          <div class="room-number">${i}</div>
          <div class="room-label">${i}번 방</div>
          <div class="room-count">${count}문장 이어짐</div>
        `;
        container.appendChild(card);
      }
    }

    function openRoom(roomNum) {
      currentRoom = roomNum;
      document.getElementById("room-list-view").style.display = "none";
      document.getElementById("novel-detail-view").style.display = "block";
      document.getElementById("btn-back").style.display = "inline-block";
      document.getElementById("page-title").innerText = `📖 ${roomNum}번 방 릴레이 소설`;
      document.getElementById("current-room-title").innerText = `${roomNum}번 방 이야기`;

      document.getElementById("input-line").value = "";
      renderNovelEntries();
      document.getElementById("input-name").focus();
    }

    function goHome() {
      currentRoom = null;
      document.getElementById("novel-detail-view").style.display = "none";
      document.getElementById("room-list-view").style.display = "block";
      document.getElementById("btn-back").style.display = "none";
      document.getElementById("page-title").innerText = "📖 우리 반 릴레이 소설 방";
      renderRoomList();
    }

    function renderNovelEntries() {
      const container = document.getElementById("novel-entries");
      const lineCountBadge = document.getElementById("line-count");
      if (!container) return;
      container.innerHTML = "";

      const entries = (novelData && novelData[currentRoom]) ? novelData[currentRoom] : [];
      lineCountBadge.innerText = `${entries.length}개 문장`;

      if (entries.length === 0) {
        container.innerHTML = `<div class="empty-state">아직 작성된 이야기가 없어요!<br>첫 문장을 적어 이야기를 시작해 보세요 ✨</div>`;
        return;
      }

      entries.forEach((item) => {
        const row = document.createElement("div");
        row.className = "novel-entry";
        const delBtn = isAdmin ? `<button class="btn-del-sm" onclick="deleteSingleLine(${item.rowId})">삭제</button>` : '';

        row.innerHTML = `
          <span class="entry-author">${escapeHtml(item.name)}</span>
          <span class="entry-text">${escapeHtml(item.text)}</span>
          ${delBtn}
        `;
        container.appendChild(row);
      });

      const scrollBox = document.getElementById("novel-scroll-box");
      scrollBox.scrollTop = scrollBox.scrollHeight;
    }

    // 서버에 전송 (no-cors 폼 인코딩 방식)
    async function sendCommand(dataObj) {
      if (!SCRIPT_URL || SCRIPT_URL.includes("여기에_복사한")) {
        alert("구글 웹앱 URL이 설정되지 않았습니다.");
        return;
      }

      document.getElementById("sync-indicator").innerText = "저장 중...";
      const params = new URLSearchParams();
      for (const k in dataObj) {
        params.append(k, dataObj[k]);
      }

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });
        setTimeout(fetchData, 1200);
      } catch (e) {
        alert("전송 중 네트워크 오류가 발생했습니다.");
      }
    }

    async function submitLine() {
      const nameInput = document.getElementById("input-name");
      const lineInput = document.getElementById("input-line");
      const btn = document.getElementById("btn-submit");

      const name = nameInput.value.trim();
      const text = lineInput.value.trim();

      if (!name) { alert("이름(또는 번호)을 입력하세요!"); nameInput.focus(); return; }
      if (!text) { alert("소설 내용을 입력하세요!"); lineInput.focus(); return; }

      btn.disabled = true;
      btn.innerText = "등록 중...";

      // 화면에 즉시 임시 표시 (반응속도 향상)
      if (!novelData[currentRoom]) novelData[currentRoom] = [];
      novelData[currentRoom].push({ name: name, text: text, rowId: 99999 });
      renderNovelEntries();

      await sendCommand({ action: "add", room: currentRoom, name: name, text: text });

      lineInput.value = "";
      btn.disabled = false;
      btn.innerText = "한 줄 이어쓰기 ✍️";
      lineInput.focus();
    }

    async function deleteSingleLine(rowId) {
      if (!confirm("이 문장을 삭제하시겠습니까?")) return;
      await sendCommand({ action: "delete_single", rowId: rowId });
    }

    async function confirmDeleteRoom() {
      if (!confirm(`정말 [${currentRoom}번 방]의 모든 이야기를 삭제하시겠습니까?`)) return;
      await sendCommand({ action: "delete_room", room: currentRoom });
    }

    async function confirmDeleteAll() {
      const chk = prompt("전체 방의 모든 소설이 영구 삭제됩니다!\n진행하시려면 '초기화'를 입력하세요:");
      if (chk === "초기화") {
        await sendCommand({ action: "delete_all" });
      }
    }

    document.getElementById("input-line").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitLine();
    });

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 주기적 동기화
    fetchData();
    setInterval(fetchData, 4000);
  </script>
</body>
</html>
